<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Noor Hossain — UI/UX Designer and Front-End Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#312E81"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A5F3FC"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.45">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="20" fill="url(#glow1)"/>
  <rect width="1200" height="300" rx="20" fill="url(#glow2)"/>

  <!-- decorative UI frame -->
  <g transform="translate(860 62)" opacity="0.9">
    <rect width="270" height="176" rx="14" fill="#0B1020" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <circle cx="20" cy="18" r="5" fill="#F87171"/><circle cx="36" cy="18" r="5" fill="#FBBF24"/><circle cx="52" cy="18" r="5" fill="#34D399"/>
    <rect x="18" y="40" width="140" height="12" rx="6" fill="#818CF8"/>
    <rect x="18" y="62" width="200" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.25"/>
    <rect x="18" y="78" width="170" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="18" y="104" width="72" height="26" rx="13" fill="#22D3EE"/>
    <rect x="98" y="104" width="72" height="26" rx="13" fill="none" stroke="#FFFFFF" stroke-opacity="0.4"/>
    <rect x="18" y="144" width="70" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.1"/>
    <rect x="96" y="144" width="70" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.1"/>
    <rect x="174" y="144" width="70" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.1"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="64" y="70" width="210" height="30" rx="15" fill="#22C55E" fill-opacity="0.15" stroke="#22C55E" stroke-opacity="0.6"/>
    <circle cx="84" cy="85" r="5" fill="#22C55E"/>
    <text x="98" y="90" font-size="14" font-weight="600" fill="#BBF7D0">Open to freelance work</text>

    <text x="62" y="160" font-size="60" font-weight="800" fill="url(#txt)" letter-spacing="-1.5">Noor Hossain</text>
    <text x="64" y="200" font-size="22" font-weight="600" fill="#E0E7FF">UI/UX Designer · Front-End Developer</text>
    <text x="64" y="236" font-size="16" fill="#A5B4FC">Figma → pixel-perfect Next.js  ·  SaaS  ·  E-commerce  ·  Landing pages that convert</text>
  </g>
</svg>
